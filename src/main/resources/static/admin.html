<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusNova Admin</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:1150px;margin:auto"><header><div><p class="eyebrow">CAMPUSNOVA / ADMINISTRATION</p><h1>Command centre</h1></div><a class="button" href="/">← Student experience</a></header><section class="metrics" id="metrics"><div><strong>—</strong><span>Total questions</span></div><div><strong>—</strong><span>Answered</span></div><div><strong>—</strong><span>Success rate</span></div></section><section class="content-section"><p class="eyebrow">KNOWLEDGE MANAGEMENT</p><h2>Add a new answer</h2><form id="faqForm" style="display:grid;gap:8px;background:#fff;border:1px solid #e2e8ea;padding:20px"><input id="category" placeholder="Category e.g. Library" required><input id="faqQuestion" placeholder="Student question" required><input id="keywords" placeholder="Keywords, separated by spaces"><textarea id="answer" placeholder="Reliable response" required style="min-height:100px;padding:12px;border:1px solid #dce4e6;font:13px Manrope"></textarea><button class="button" type="submit">Publish to NOVA →</button></form></section><section class="content-section"><p class="eyebrow">LIVE KNOWLEDGE</p><h2>FAQ management</h2><div id="faqs" class="faq-grid"></div></section><section class="content-section"><p class="eyebrow">USAGE</p><h2>Recent questions</h2><div id="queries" class="announcements"></div></section></main><script>const token=localStorage.novaAdmin;if(!token)location.href='/';const H={'X-Admin-Token':token,'Content-Type':'application/json'};async function load(){let a=await(await fetch('/api/admin/analytics',{headers:H})).json();document.querySelector('#metrics').innerHTML=`<div><strong>${a.totalQuestions}</strong><span>Total questions</span></div><div><strong>${a.answered}</strong><span>Answered</span></div><div><strong>${a.successRate}%</strong><span>Response success rate</span></div>`;let f=await(await fetch('/api/faqs')).json();faqs.innerHTML=f.map(x=>`<article><span>${x.category.name}</span><b>${x.question}</b><p>${x.answer}</p><button onclick="del(${x.id})">Remove</button></article>`).join('');queries.innerHTML=a.recentQueries.slice(-10).reverse().map(x=>`<article><b>${x.question}</b><p>${x.category} · ${x.answered?'Answered':'Needs review'}</p></article>`).join('')||'<article><p>No conversations have been recorded yet.</p></article>'}async function del(id){if(confirm('Remove this FAQ?')){await fetch('/api/admin/faqs/'+id,{method:'DELETE',headers:H});load()}}faqForm.onsubmit=async e=>{e.preventDefault();await fetch('/api/admin/faqs',{method:'POST',headers:H,body:JSON.stringify({category:category.value,question:faqQuestion.value,keywords:keywords.value,answer:answer.value})});e.target.reset();load()};load()</script></body></html>
