spring.application.name=CampusNova
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:campusnova;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
server.port=${PORT:8080}
server.error.include-message=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
campusnova.ai.enabled=${BEDROCK_ENABLED:false}
campusnova.ai.model-id=${BEDROCK_MODEL_ID:}
campusnova.ai.region=${AWS_REGION:}
campusnova.ai.knowledge-base-id=${BEDROCK_KNOWLEDGE_BASE_ID:}
campusnova.ai.guardrail-id=${BEDROCK_GUARDRAIL_ID:}
campusnova.ai.guardrail-version=${BEDROCK_GUARDRAIL_VERSION:}
